# DEPRECATED. Do not run this recorder together with mds_clickhouse_bbo.
# IBKR BBO is now a selector on the unified consumer (table crypto_bbo,
# prefix /selfquant.mds.bbo). Starting both writers duplicates rows.
clickhouse_bbo:
  host: 127.0.0.1
  service: "8443"
  database: market_data
  table: equity_bbo
  user: bbo_writer
  password_env: CLICKHOUSE_PASSWORD

  shm_prefix: /selfquant.mds.ibkr

  sample_interval_ms: 1000
  stale_cutoff_ms: 5000
  flush_interval_ms: 1000
  request_timeout_ms: 5000

  batch_rows: 5000
  queue_rows: 50000
  unresolved_rows: 4096

  selectors:
    - venue: ibkr
      product: equity
      shard: 0
