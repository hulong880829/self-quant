# Aggregate streams may be configured independently. Remove either entry when
# only aggregate BBO or aggregate order book is needed.
segments:
  - /selfquant.mds.agg_perp_usdt_binance-bitget-bybit-gate-hyperliquid-okx.btcusdt.aggbbo.2
  - /selfquant.mds.agg_perp_usdt_binance-bitget-bybit-gate-hyperliquid-okx.btcusdt.aggorderbook.2
  # Multiplex input can be resolved from identity and expanded across shards.
  # selector accepts exactly one of symbol, product, venue, or all. `all` is
  # intended for diagnostics; services should use an explicit selector.
  # - multiplex:
  #     prefix: /selfquant.mds
  #     venue: binance
  #     product: PERPETUAL
  #     stream: orderbook
  #     shard_count: 4
  #   selector:
  #     symbol: BTCUSDT

ingestion:
  # These watchdogs start only after the first ready aggregate image. A short
  # stall keeps the last-good image; a sustained stall emits one hard reset.
  stale_after_ms: 5000
  hard_reset_after_ms: 10000
  # Bound each segment's work per poll so hot symbols cannot starve others.
  max_drain_records: 512

gateway:
  listen_address: 127.0.0.1
  port: 9443
  # 明文 WebSocket 仍强制 Bearer Token；这里只保存环境变量名。
  auth_token_env: MDS_GATEWAY_TOKEN
  max_clients: 128
  max_subscriptions_per_client: 32
  send_queue_slots: 1
  # 实时发布允许 10ms 及以上，与 ClickHouse 聚合采样周期相互独立。
  publish_interval_ms: 50
  ping_interval_ms: 15000
  pong_timeout_ms: 5000
  slow_client_timeout_ms: 5000
  depth: 50
  reuse_port: false

# History table TTL is fixed at 24h in DDL.
clickhouse_aggregate:
  host: 127.0.0.1
  service: "8443"
  database: market_data
  user: bbo_writer
  password_env: CLICKHOUSE_PASSWORD
  bbo_table: aggregate_bbo_history
  orderbook_table: aggregate_orderbook_history
  catalog_table: aggregate_topic_catalog
  catalog_scope: prod-agg
  sample_interval_ms: 200
  depth: 50
  flush_interval_ms: 1000
  request_timeout_ms: 5000
  batch_rows: 1000
  bbo_queue_rows: 4096
  orderbook_queue_rows: 2048
  catalog_queue_rows: 256
  max_queued_bytes: 67108864
