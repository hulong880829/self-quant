# C++ fairprice shadow configuration. Copy of the production example with
# an isolated HTTP port, SHM prefix, and persistence disabled.
version: 2

runtime:
  log_level: info
  development: true

market_data:
  sample_interval_ms: 200
  depth: 50
  snapshot_stale_after_ms: 15000
  catalog_refresh_interval_ms: 1000
  clickhouse:
    host: 127.0.0.1
    service: "8443"
    database: market_data
    user: bbo_writer
    password: "CHANGE_ME_CLICKHOUSE_PASSWORD"
  gateway_bootstrap:
    url: "ws://127.0.0.1:9443/v1/market-data"
    token: "CHANGE_ME_GATEWAY_TOKEN"
    timeout_ms: 5000

shared_memory:
  backend: posix_shm
  output:
    prefix: /selfquant.mds.shadow
    ring_bytes: 8388608
    max_record_bytes: 65536
    max_readers: 32
    reader_lease_timeout_ms: 5000
    unlink_on_shutdown: false

server:
  listen_address: 127.0.0.1
  port: 19093
  allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  browser_token: ""
  max_clients: 128
  max_subscriptions_per_client: 16
  read_header_timeout_ms: 5000
  idle_timeout_ms: 60000
  max_header_bytes: 16384
  websocket:
    handshake_timeout_ms: 5000
    read_limit_bytes: 4096
    write_buffer_bytes: 65536
    pong_timeout_ms: 45000

stream:
  interval_ms: 50

history:
  workers: 1
  resolution_ms: 60000

fair_price:
  enabled: true
  depth: 20
  lambda_per_bp: 0.10
  imbalance_alpha: 1.0
  ewma_tau_ms: 500
  impact_notional: 0.0
  venue_dominance_ratio: 0.90
  stream_interval_ms: 5
  heartbeat_ms: 1000

  persistence:
    enabled: false
    database_url: ""
    sample_interval_ms: 1000
    retention_hours: 24
    cleanup_interval_ms: 300000
    delete_batch: 10000
    delete_max_batches: 20
    operation_timeout_ms: 5000
