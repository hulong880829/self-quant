# Backend stack. Interpolated ${VAR} values come from the shell or
# `--env-file` (typically backend/.env). Container secrets/config also
# load from env_file: ../.env; environment: entries override localhost
# network defaults so services use Compose DNS. aggdata uses host
# networking to reach the loopback MDS gateway.
#
# Default: infrastructure + all Go services.
# Infrastructure only (the `infra` workflow for host `go run` debugging):
#   docker compose --env-file ../.env up -d postgres redis clickhouse

x-backend: &backend
  image: selfquant-backend:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file:
    - ../.env
  restart: unless-stopped

x-grpc-health: &grpc-health
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 45s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: selfquant
      POSTGRES_USER: selfquant
      POSTGRES_PASSWORD: selfquant
    ports:
      - "5432:5432"
    volumes:
      - selfquant-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfquant -d selfquant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: crypto BBO storage for host-side mds_shm_consumer --clickhouse-bbo
  # and compose-side spread/funding ranking. Generate TLS certs first:
  # backend/deploy/clickhouse/generate-certs.sh
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "8443:8443"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: market_data
      CLICKHOUSE_USER: bbo_writer
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_BBO_PASSWORD:-changeme}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d/logging.xml:/etc/clickhouse-server/users.d/logging.xml:ro
      - ./clickhouse/certs:/etc/clickhouse-server/certs:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8123/ping | grep -q Ok",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  funding-service:
    <<: *backend
    command: ["/out/funding-service"]
    mem_limit: 1536m
    deploy:
      resources:
        limits:
          memory: 1536m
    environment:
      DATABASE_URL: postgres://selfquant:selfquant@postgres:5432/selfquant?sslmode=disable
      FUNDING_GRPC_ADDRESS: :9090
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_TLS: "false"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_BBO_PASSWORD:-changeme}
      GOMEMLIMIT: 1200MiB
      GOGC: "100"
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9090"]

  account-service:
    <<: *backend
    command: ["/out/account-service"]
    environment:
      DATABASE_URL: postgres://selfquant:selfquant@postgres:5432/selfquant?sslmode=disable
      ACCOUNT_GRPC_ADDRESS: :9091
    ports:
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9091"]

  polymarket-service:
    <<: *backend
    command: ["/out/polymarket-service"]
    environment:
      DATABASE_URL: postgres://selfquant:selfquant@postgres:5432/selfquant?sslmode=disable
      POLYMARKET_GRPC_ADDRESS: :9092
      ACCOUNT_GRPC_TARGET: account-service:9091
    ports:
      - "9092:9092"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9092"]

  report-service:
    <<: *backend
    command: ["/out/report-service"]
    environment:
      DATABASE_URL: postgres://selfquant:selfquant@postgres:5432/selfquant?sslmode=disable
      REPORT_GRPC_ADDRESS: :9094
      ACCOUNT_GRPC_TARGET: account-service:9091
      REPORT_INTERNAL_TOKEN: ${REPORT_INTERNAL_TOKEN:?REPORT_INTERNAL_TOKEN is required}
    ports:
      - "9094:9094"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9094"]

  trader-service:
    <<: *backend
    command: ["/out/trader-service"]
    environment:
      DATABASE_URL: postgres://selfquant:selfquant@postgres:5432/selfquant?sslmode=disable
      TRADER_GRPC_ADDRESS: :9095
      ACCOUNT_GRPC_TARGET: account-service:9091
      TRADER_INTERNAL_TOKEN: ${TRADER_INTERNAL_TOKEN:?TRADER_INTERNAL_TOKEN is required}
    ports:
      - "9095:9095"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9095"]

  ai-service:
    <<: *backend
    command: ["/out/ai-service"]
    environment:
      DATABASE_URL: postgres://selfquant:selfquant@postgres:5432/selfquant?sslmode=disable
      AI_GRPC_ADDRESS: :9096
      ACCOUNT_GRPC_TARGET: account-service:9091
      FUNDING_GRPC_TARGET: funding-service:9090
    ports:
      - "9096:9096"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
      funding-service:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9096"]

  spread-service:
    <<: *backend
    command: ["/out/spread-service"]
    environment:
      SPREAD_GRPC_ADDRESS: :9097
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_TLS: "false"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_BBO_PASSWORD:-changeme}
    ports:
      - "9097:9097"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9097"]

  # Host network: C++ MDS gateway binds 127.0.0.1:9443, which is not
  # reachable via docker0 / host.docker.internal.
  aggdata-service:
    <<: *backend
    command: ["/out/aggdata-service"]
    network_mode: host
    environment:
      DATABASE_URL: postgres://selfquant:selfquant@127.0.0.1:5432/selfquant?sslmode=disable
      AGGDATA_HTTP_ADDRESS: :9093
      AGGDATA_MDS_GATEWAY_URL: ws://127.0.0.1:9443/v1/market-data
      AGGDATA_RECORDING_DIR: /data/aggdata
      MDS_GATEWAY_TOKEN: ${MDS_GATEWAY_TOKEN:?MDS_GATEWAY_TOKEN is required}
    volumes:
      - ${AGGDATA_RECORDING_DIR:-/tmp/marketdata/crypto}:/data/aggdata
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://127.0.0.1:9093/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  api-gateway:
    <<: *backend
    command: ["/out/api-gateway"]
    environment:
      API_HTTP_ADDRESS: :8080
      FUNDING_GRPC_TARGET: funding-service:9090
      ACCOUNT_GRPC_TARGET: account-service:9091
      POLYMARKET_GRPC_TARGET: polymarket-service:9092
      REPORT_GRPC_TARGET: report-service:9094
      TRADER_GRPC_TARGET: trader-service:9095
      AI_GRPC_TARGET: ai-service:9096
      SPREAD_GRPC_TARGET: spread-service:9097
    ports:
      - "8080:8080"
    depends_on:
      funding-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      polymarket-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      trader-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      spread-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  selfquant-postgres:
  clickhouse-data:
