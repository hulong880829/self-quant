# Backend stack. Interpolated ${VAR} values come from the host
# `--env-file` (typically backend/.env). Containers load non-secret
# config from env/container.shared.env generated by
# `make prepare-compose-env`. Secrets are injected per service.
# Do not point env_file at ../.env.
#
# Default: infrastructure + all Go services.
# Infrastructure only (the `infra` workflow for host `go run` debugging):
#   docker compose --env-file ../.env up -d postgres redis clickhouse

x-backend: &backend
  image: selfquant-backend:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file:
    - env/container.shared.env
  restart: unless-stopped

x-grpc-health: &grpc-health
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 45s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: selfquant
      POSTGRES_USER: selfquant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - selfquant-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfquant -d selfquant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --save ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: crypto BBO storage for host-side mds_shm_consumer --clickhouse-bbo
  # and compose-side spread/funding ranking. Generate TLS certs first:
  # backend/deploy/clickhouse/generate-certs.sh
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: market_data
      CLICKHOUSE_USER: bbo_writer
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d/logging.xml:/etc/clickhouse-server/users.d/logging.xml:ro
      - ./clickhouse/certs:/etc/clickhouse-server/certs:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8123/ping | grep -q Ok",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse-migrate:
    image: clickhouse/clickhouse-server:24.8
    restart: "no"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER is required}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_MIGRATION_DIR: /migrations
    volumes:
      - ./clickhouse/migrations:/migrations:ro
      - ./clickhouse/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/bash", "/migrate.sh"]
    depends_on:
      clickhouse:
        condition: service_healthy

  funding-service:
    <<: *backend
    command: ["/out/funding-service"]
    mem_limit: 1536m
    deploy:
      resources:
        limits:
          memory: 1536m
    environment:
      DATABASE_URL: postgres://selfquant:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/selfquant?sslmode=disable
      FUNDING_GRPC_ADDRESS: :9090
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_TLS: "false"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      GOMEMLIMIT: 1200MiB
      GOGC: "100"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9090"]

  account-service:
    <<: *backend
    command: ["/out/account-service"]
    environment:
      DATABASE_URL: postgres://selfquant:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/selfquant?sslmode=disable
      ACCOUNT_GRPC_ADDRESS: :9091
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:?GATEWAY_INTERNAL_TOKEN is required}
      ADMIN_INTERNAL_TOKEN: ${ADMIN_INTERNAL_TOKEN:?ADMIN_INTERNAL_TOKEN is required}
      REPORT_INTERNAL_TOKEN: ${REPORT_INTERNAL_TOKEN:?REPORT_INTERNAL_TOKEN is required}
      TRADER_INTERNAL_TOKEN: ${TRADER_INTERNAL_TOKEN:?TRADER_INTERNAL_TOKEN is required}
      ACCOUNT_TOKEN_SECRET: ${ACCOUNT_TOKEN_SECRET:?ACCOUNT_TOKEN_SECRET is required}
      ACCOUNT_CREDENTIALS_KEY: ${ACCOUNT_CREDENTIALS_KEY:?ACCOUNT_CREDENTIALS_KEY is required}
    ports:
      - "127.0.0.1:9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9091"]

  polymarket-service:
    <<: *backend
    command: ["/out/polymarket-service"]
    environment:
      DATABASE_URL: postgres://selfquant:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/selfquant?sslmode=disable
      POLYMARKET_GRPC_ADDRESS: :9092
      ACCOUNT_GRPC_TARGET: account-service:9091
      POLYMARKET_CHAINLINK_HISTORY_TOKEN: ${POLYMARKET_CHAINLINK_HISTORY_TOKEN:-}
    ports:
      - "127.0.0.1:9092:9092"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9092"]

  report-service:
    <<: *backend
    command: ["/out/report-service"]
    environment:
      DATABASE_URL: postgres://selfquant:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/selfquant?sslmode=disable
      REPORT_GRPC_ADDRESS: :9094
      ACCOUNT_GRPC_TARGET: account-service:9091
      REPORT_INTERNAL_TOKEN: ${REPORT_INTERNAL_TOKEN:?REPORT_INTERNAL_TOKEN is required}
    ports:
      - "127.0.0.1:9094:9094"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9094"]

  trader-service:
    <<: *backend
    command: ["/out/trader-service"]
    environment:
      DATABASE_URL: postgres://selfquant:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/selfquant?sslmode=disable
      TRADER_GRPC_ADDRESS: :9095
      ACCOUNT_GRPC_TARGET: account-service:9091
      TRADER_INTERNAL_TOKEN: ${TRADER_INTERNAL_TOKEN:?TRADER_INTERNAL_TOKEN is required}
      ADMIN_INTERNAL_TOKEN: ${ADMIN_INTERNAL_TOKEN:?ADMIN_INTERNAL_TOKEN is required}
      TRADER_ARBITRAGE_DRY_RUN: ${TRADER_ARBITRAGE_DRY_RUN:?TRADER_ARBITRAGE_DRY_RUN is required}
    ports:
      - "127.0.0.1:9095:9095"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9095"]

  ai-service:
    <<: *backend
    command: ["/out/ai-service"]
    environment:
      DATABASE_URL: postgres://selfquant:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/selfquant?sslmode=disable
      AI_GRPC_ADDRESS: :9096
      ACCOUNT_GRPC_TARGET: account-service:9091
      FUNDING_GRPC_TARGET: funding-service:9090
    ports:
      - "127.0.0.1:9096:9096"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
      funding-service:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9096"]

  spread-service:
    <<: *backend
    command: ["/out/spread-service"]
    environment:
      SPREAD_GRPC_ADDRESS: :9097
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_TLS: "false"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    ports:
      - "127.0.0.1:9097:9097"
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9097"]

  jev-service:
    <<: *backend
    command: ["/out/jev-service"]
    environment:
      DATABASE_URL: postgres://selfquant:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/selfquant?sslmode=disable
      JEV_GRPC_ADDRESS: :9098
      FUNDING_GRPC_TARGET: funding-service:9090
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_TLS: "false"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai/v1/systemone}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
      JEV_ENABLED: ${JEV_ENABLED:?JEV_ENABLED is required}
      JEV_TYPESAFE_TIMEOUT: ${JEV_TYPESAFE_TIMEOUT:?JEV_TYPESAFE_TIMEOUT is required}
      JEV_CYCLE_INTERVAL: ${JEV_CYCLE_INTERVAL:?JEV_CYCLE_INTERVAL is required}
      JEV_FILL_WAIT: ${JEV_FILL_WAIT:?JEV_FILL_WAIT is required}
      JEV_BBO_MAX_AGE: ${JEV_BBO_MAX_AGE:?JEV_BBO_MAX_AGE is required}
      JEV_FUNDING_PRICE_MAX_AGE: ${JEV_FUNDING_PRICE_MAX_AGE:?JEV_FUNDING_PRICE_MAX_AGE is required}
      JEV_RATE_MAX_AGE: ${JEV_RATE_MAX_AGE:?JEV_RATE_MAX_AGE is required}
      JEV_MIN_TURNOVER_USD: ${JEV_MIN_TURNOVER_USD:?JEV_MIN_TURNOVER_USD is required}
      JEV_MIN_DEPTH_USD: ${JEV_MIN_DEPTH_USD:?JEV_MIN_DEPTH_USD is required}
      JEV_POSITION_NOTIONAL_USDT: ${JEV_POSITION_NOTIONAL_USDT:?JEV_POSITION_NOTIONAL_USDT is required}
      JEV_PAPER_ROUND_TRIP_COST_BPS: ${JEV_PAPER_ROUND_TRIP_COST_BPS:?JEV_PAPER_ROUND_TRIP_COST_BPS is required}
      JEV_PAPER_INITIAL_EQUITY: ${JEV_PAPER_INITIAL_EQUITY:?JEV_PAPER_INITIAL_EQUITY is required}
      JEV_MIN_EXIT_PROBABILITY: ${JEV_MIN_EXIT_PROBABILITY:?JEV_MIN_EXIT_PROBABILITY is required}
      JEV_MAX_HOLD_DURATION: ${JEV_MAX_HOLD_DURATION:?JEV_MAX_HOLD_DURATION is required}
      JEV_MAX_CONCURRENT_DECISIONS: ${JEV_MAX_CONCURRENT_DECISIONS:?JEV_MAX_CONCURRENT_DECISIONS is required}
      JEV_MAX_ENTRY_DECISIONS_PER_CYCLE: ${JEV_MAX_ENTRY_DECISIONS_PER_CYCLE:?JEV_MAX_ENTRY_DECISIONS_PER_CYCLE is required}
      JEV_MAX_OPEN_POSITIONS: ${JEV_MAX_OPEN_POSITIONS:?JEV_MAX_OPEN_POSITIONS is required}
      JEV_USDT_USDC_ONE_TO_ONE: ${JEV_USDT_USDC_ONE_TO_ONE:?JEV_USDT_USDC_ONE_TO_ONE is required}
      JEV_BASIS_LOOKBACK: ${JEV_BASIS_LOOKBACK:?JEV_BASIS_LOOKBACK is required}
      JEV_BASIS_FORECAST_HORIZON: ${JEV_BASIS_FORECAST_HORIZON:?JEV_BASIS_FORECAST_HORIZON is required}
      JEV_BASIS_REFRESH_INTERVAL: ${JEV_BASIS_REFRESH_INTERVAL:?JEV_BASIS_REFRESH_INTERVAL is required}
      JEV_BASIS_CACHE_MAX_AGE: ${JEV_BASIS_CACHE_MAX_AGE:?JEV_BASIS_CACHE_MAX_AGE is required}
      JEV_MIN_EXPECTED_NET_RETURN_24H: ${JEV_MIN_EXPECTED_NET_RETURN_24H:?JEV_MIN_EXPECTED_NET_RETURN_24H is required}
      JEV_MIN_CONSERVATIVE_NET_RETURN_24H: ${JEV_MIN_CONSERVATIVE_NET_RETURN_24H:?JEV_MIN_CONSERVATIVE_NET_RETURN_24H is required}
      JEV_MIN_NET_PROFIT_PROBABILITY: ${JEV_MIN_NET_PROFIT_PROBABILITY:?JEV_MIN_NET_PROFIT_PROBABILITY is required}
      JEV_MIN_BASIS_FORECAST_CONFIDENCE: ${JEV_MIN_BASIS_FORECAST_CONFIDENCE:?JEV_MIN_BASIS_FORECAST_CONFIDENCE is required}
      JEV_MIN_ENTER_PROBABILITY: ${JEV_MIN_ENTER_PROBABILITY:?JEV_MIN_ENTER_PROBABILITY is required}
      JEV_MIN_ENTER_CONFIDENCE: ${JEV_MIN_ENTER_CONFIDENCE:?JEV_MIN_ENTER_CONFIDENCE is required}
      JEV_BASIS_MATCH_BAND_BPS: ${JEV_BASIS_MATCH_BAND_BPS:?JEV_BASIS_MATCH_BAND_BPS is required}
      JEV_BASIS_CONFIDENCE_SAMPLE_TARGET: ${JEV_BASIS_CONFIDENCE_SAMPLE_TARGET:?JEV_BASIS_CONFIDENCE_SAMPLE_TARGET is required}
      JEV_STOP_LOSS_NET_USDT: ${JEV_STOP_LOSS_NET_USDT:?JEV_STOP_LOSS_NET_USDT is required}
      JEV_TAKE_PROFIT_PAD_USDT: ${JEV_TAKE_PROFIT_PAD_USDT:?JEV_TAKE_PROFIT_PAD_USDT is required}
      JEV_EXIT_CONFIRM_CYCLES: ${JEV_EXIT_CONFIRM_CYCLES:?JEV_EXIT_CONFIRM_CYCLES is required}
      JEV_MISSING_BBO_FORCE_AFTER: ${JEV_MISSING_BBO_FORCE_AFTER:?JEV_MISSING_BBO_FORCE_AFTER is required}
      JEV_PROBABILITY_SUM_TOLERANCE: ${JEV_PROBABILITY_SUM_TOLERANCE:?JEV_PROBABILITY_SUM_TOLERANCE is required}
    ports:
      - "127.0.0.1:9098:9098"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
      funding-service:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9098"]

  api-gateway:
    <<: *backend
    command: ["/out/api-gateway"]
    environment:
      API_HTTP_ADDRESS: :8080
      FUNDING_GRPC_TARGET: funding-service:9090
      ACCOUNT_GRPC_TARGET: account-service:9091
      POLYMARKET_GRPC_TARGET: polymarket-service:9092
      REPORT_GRPC_TARGET: report-service:9094
      TRADER_GRPC_TARGET: trader-service:9095
      AI_GRPC_TARGET: ai-service:9096
      SPREAD_GRPC_TARGET: spread-service:9097
      JEV_GRPC_TARGET: jev-service:9098
      ADMIN_GRPC_TARGET: admin-service:9099
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:?GATEWAY_INTERNAL_TOKEN is required}
      BROKER_JWT_PUBLIC_KEY_FILE: /secrets/broker-jwt-ed25519.pub
    volumes:
      - ./secrets/broker-jwt-ed25519.pub:/secrets/broker-jwt-ed25519.pub:ro
    ports:
      - "8080:8080"
    depends_on:
      funding-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      polymarket-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      trader-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      spread-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  broker-jwt-secret-init:
    image: busybox:1.37.0-musl
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -eu
        umask 077
        cp /source/broker-jwt-ed25519.pem /staged/.broker-jwt-ed25519.pem.tmp
        chmod 0444 /staged/.broker-jwt-ed25519.pem.tmp
        mv -f /staged/.broker-jwt-ed25519.pem.tmp /staged/broker-jwt-ed25519.pem
    volumes:
      - ./secrets/broker-jwt-ed25519.pem:/source/broker-jwt-ed25519.pem:ro
      - broker-jwt-private:/staged

  admin-service:
    <<: *backend
    command: ["/out/admin-service"]
    environment:
      DATABASE_URL: postgres://selfquant:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/selfquant?sslmode=disable
      ADMIN_GRPC_ADDRESS: :9099
      ACCOUNT_GRPC_TARGET: account-service:9091
      TRADER_GRPC_TARGET: trader-service:9095
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:?GATEWAY_INTERNAL_TOKEN is required}
      ADMIN_INTERNAL_TOKEN: ${ADMIN_INTERNAL_TOKEN:?ADMIN_INTERNAL_TOKEN is required}
      BROKER_JWT_PRIVATE_KEY_FILE: /secrets/broker-jwt-ed25519.pem
    volumes:
      - broker-jwt-private:/secrets:ro
    expose:
      - "9099"
    ports:
      - "127.0.0.1:9099:9099"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
      trader-service:
        condition: service_healthy
      broker-jwt-secret-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "/out/grpc-health-probe", "-addr=:9099"]

  # Optional IBKR Gateway for the host C++ producer. Not started unless
  # `--profile ibkr` is set, so missing TWS credentials do not block the
  # default backend stack. Credentials interpolate from the host environment
  # or `--env-file` and must not use `:?` (Compose interpolates every service
  # before profiles are applied). Paper API is 127.0.0.1:4002; live is
  # 127.0.0.1:4001. No healthcheck: a listening port is not a logged-in session.
  ib-gateway:
    profiles: ["ibkr"]
    image: ghcr.io/gnzsnz/ib-gateway:10.45.1j@sha256:91165c0752ca534c0dad3c40683ae7c2745974d4d277651a90e90411ca609d8d
    restart: unless-stopped
    environment:
      TRADING_MODE: ${IBKR_TRADING_MODE:-live}
      READ_ONLY_API: ${IBKR_READ_ONLY_API:-no}
      TWS_ACCEPT_INCOMING: accept
      TWS_USERID: ${TWS_USERID:-}
      TWS_PASSWORD: ${TWS_PASSWORD:-}

      TWOFA_TIMEOUT_ACTION: ${IBKR_TWOFA_TIMEOUT_ACTION:-restart}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${IBKR_RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      TWOFA_EXIT_INTERVAL: ${IBKR_TWOFA_EXIT_INTERVAL:-120}
      AUTO_RESTART_TIME: "${IBKR_AUTO_RESTART_TIME:-04:00 AM}"
      TWOFA_DEVICE: ${IBKR_TWOFA_DEVICE:-}

      TIME_ZONE: ${IBKR_TIME_ZONE:-Etc/UTC}
      TZ: ${IBKR_TIME_ZONE:-Etc/UTC}
      TWS_SETTINGS_PATH: /home/ibgateway/tws_settings
    ports:
      - "127.0.0.1:4001:4003"
      - "127.0.0.1:4002:4004"
    volumes:
      - ibgateway-settings:/home/ibgateway/tws_settings

  # Isolated paper-only gateway for OMS acceptance. It never shares the live
  # settings volume or host ports and is not started by the normal ibkr profile.
  ibkr-paper:
    profiles: ["ibkr-paper"]
    container_name: selfquant-ibkr-paper
    image: ghcr.io/gnzsnz/ib-gateway:10.45.1j@sha256:91165c0752ca534c0dad3c40683ae7c2745974d4d277651a90e90411ca609d8d
    restart: "no"
    environment:
      TRADING_MODE: paper
      READ_ONLY_API: ${IBKR_PAPER_READ_ONLY_API:-no}
      TWS_ACCEPT_INCOMING: accept
      TWS_USERID: ${IBKR_PAPER_TWS_USERID:-}
      TWS_PASSWORD: ${IBKR_PAPER_TWS_PASSWORD:-}
      TWOFA_TIMEOUT_ACTION: ${IBKR_PAPER_TWOFA_TIMEOUT_ACTION:-exit}
      RELOGIN_AFTER_TWOFA_TIMEOUT: "no"
      TWOFA_EXIT_INTERVAL: ${IBKR_PAPER_TWOFA_EXIT_INTERVAL:-120}
      TWOFA_DEVICE: ${IBKR_PAPER_TWOFA_DEVICE:-}
      TIME_ZONE: ${IBKR_TIME_ZONE:-Etc/UTC}
      TZ: ${IBKR_TIME_ZONE:-Etc/UTC}
      TWS_SETTINGS_PATH: /home/ibgateway/tws_settings
    ports:
      - "127.0.0.1:4102:4004"
    volumes:
      - ibgateway-paper-settings:/home/ibgateway/tws_settings

  # Optional host-equivalent web image. Omit --profile web to keep running
  # the frontend on the host. Build args are browser-facing URLs.
  web:
    profiles: ["web"]
    image: selfquant-web:local
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_AGGDATA_BASE_URL: ${NEXT_PUBLIC_AGGDATA_BASE_URL:-}
        NEXT_PUBLIC_AGGDATA_WS_URL: ${NEXT_PUBLIC_AGGDATA_WS_URL:-}
        NEXT_PUBLIC_AGGDATA_TOKEN: ${NEXT_PUBLIC_AGGDATA_TOKEN:-}
        NEXT_PUBLIC_AGGDATA_FAIRPRICE_PROFILE: ${NEXT_PUBLIC_AGGDATA_FAIRPRICE_PROFILE:-}
        NEXT_PUBLIC_AGGDATA_FAIRPRICE_QUOTE: ${NEXT_PUBLIC_AGGDATA_FAIRPRICE_QUOTE:-USDT}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  selfquant-postgres:
  clickhouse-data:
  broker-jwt-private:
  ibgateway-settings:
  ibgateway-paper-settings:
