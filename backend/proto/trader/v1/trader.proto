syntax = "proto3";

package trader.v1;

option go_package = "selfquant/backend/gen/trader/v1;traderv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service TraderService {
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse);
  rpc ApplyAccountProfile(ApplyAccountProfileRequest) returns (ApplyAccountProfileResponse);
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc CreateTwap(CreateTwapRequest) returns (CreateTwapResponse);
  rpc GetTwap(GetTwapRequest) returns (GetTwapResponse);
  rpc ListTwaps(ListTwapsRequest) returns (ListTwapsResponse);
  rpc ListTwapOrders(ListTwapOrdersRequest) returns (ListTwapOrdersResponse);
  rpc CancelTwap(CancelTwapRequest) returns (CancelTwapResponse);
  rpc CreateArbitrageCombination(CreateArbitrageCombinationRequest) returns (CreateArbitrageCombinationResponse);
  rpc UpdateArbitrageCombination(UpdateArbitrageCombinationRequest) returns (UpdateArbitrageCombinationResponse);
  rpc GetArbitrageCombination(GetArbitrageCombinationRequest) returns (GetArbitrageCombinationResponse);
  rpc ListArbitrageCombinations(ListArbitrageCombinationsRequest) returns (ListArbitrageCombinationsResponse);
  rpc CloseArbitrageCombination(CloseArbitrageCombinationRequest) returns (CloseArbitrageCombinationResponse);
  rpc PreflightArbitrageCombination(PreflightArbitrageCombinationRequest) returns (PreflightArbitrageCombinationResponse);
  rpc PreflightIncreaseTarget(PreflightIncreaseTargetRequest) returns (PreflightIncreaseTargetResponse);
  rpc ListArbitrageCombinationOrders(ListArbitrageCombinationOrdersRequest) returns (ListArbitrageCombinationOrdersResponse);
  rpc ListArbitrageCombinationExecutions(ListArbitrageCombinationExecutionsRequest) returns (ListArbitrageCombinationExecutionsResponse);
  rpc ListArbitrageCombinationEvents(ListArbitrageCombinationEventsRequest) returns (ListArbitrageCombinationEventsResponse);
  rpc GetArbitrageCountsByOwnerInternal(GetArbitrageCountsByOwnerInternalRequest) returns (GetArbitrageCountsByOwnerInternalResponse);
}

message Instrument {
  int64 id = 1;
  string exchange = 2;
  string contract_type = 3;
  string exchange_symbol = 4;
  string base_asset = 5;
  string quote_asset = 6;
  string settle_asset = 7;
  string contract_size = 8;
  string price_tick = 9;
  string quantity_step = 10;
}

message Order {
  string id = 1;
  string idempotency_key = 2;
  int64 trading_account_id = 3;
  string product_name = 4;
  string exchange = 5;
  int64 instrument_id = 6;
  string contract_type = 7;
  string exchange_symbol = 8;
  string client_order_id = 9;
  string venue_order_id = 10;
  string side = 11;
  string order_type = 12;
  string quantity = 13;
  string price = 14;
  string filled_quantity = 15;
  string average_price = 16;
  string status = 17;
  string error_code = 18;
  string error_message = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
  google.protobuf.Timestamp last_reconciled_at = 22;
  string sync_state = 23;
  string base_asset = 24;
  string quote_asset = 25;
  string twap_job_id = 26;
  int32 twap_slice_index = 27;
  int32 twap_attempt_index = 28;
  string arbitrage_execution_id = 29;
  string arbitrage_leg = 30;
  string arbitrage_role = 31;
  google.protobuf.Timestamp last_filled_at = 32;
  repeated OrderFee actual_fees = 33;
  string liquidity_role = 34;
}

message OrderFee {
  string amount = 1;
  string currency = 2;
}

message TwapJob {
  string id = 1;
  string idempotency_key = 2;
  int64 trading_account_id = 3;
  string product_name = 4;
  string exchange = 5;
  int64 instrument_id = 6;
  string contract_type = 7;
  string exchange_symbol = 8;
  string base_asset = 9;
  string quote_asset = 10;
  string side = 11;
  string total_quantity = 12;
  string filled_quantity = 13;
  string average_price = 14;
  google.protobuf.Timestamp start_at = 15;
  google.protobuf.Timestamp end_at = 16;
  int32 interval_seconds = 17;
  string limit_price = 18;
  string max_quantity = 19;
  string execution_type = 20;
  int32 order_timeout_seconds = 21;
  string status = 22;
  int32 current_slice = 23;
  google.protobuf.Timestamp next_action_at = 24;
  string active_order_id = 25;
  string error_message = 26;
  google.protobuf.Timestamp created_at = 27;
  google.protobuf.Timestamp updated_at = 28;
  google.protobuf.Timestamp started_at = 29;
  google.protobuf.Timestamp closed_at = 30;
  string progress = 31;
  int32 current_attempt = 32;
}

message ListInstrumentsRequest {
  string token = 1;
  int64 trading_account_id = 2;
  string contract_type = 3;
}

message ListInstrumentsResponse {
  repeated Instrument items = 1;
  google.protobuf.Timestamp server_time = 2;
  VenueCapabilities capabilities = 3;
}

message VenueCapabilities {
  repeated string products = 1;
  repeated string quote_assets = 2;
  repeated string time_in_force = 3;
  bool post_only = 4;
  bool reduce_only = 5;
  bool maker_twap = 6;
  bool private_order_stream = 7;
  bool one_way_only = 8;
}

message AccountProfileStepResult {
  string step = 1;
  string status = 2;
  string code = 3;
  string message = 4;
}

message AccountProfileResult {
  int64 trading_account_id = 1;
  string product_name = 2;
  string account_name = 3;
  string exchange = 4;
  string overall_status = 5;
  repeated AccountProfileStepResult steps = 6;
}

message ApplyAccountProfileRequest {
  string token = 1;
  int64 trading_account_id = 2;
}

message ApplyAccountProfileResponse {
  AccountProfileResult result = 1;
}

message PlaceOrderRequest {
  string token = 1;
  int64 trading_account_id = 2;
  int64 instrument_id = 3;
  string side = 4;
  string order_type = 5;
  string quantity = 6;
  string price = 7;
  string idempotency_key = 8;
}

message PlaceOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string token = 1;
  string order_id = 2;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string token = 1;
  int64 trading_account_id = 2;
  int32 limit = 3;
  string view = 4;
  string cursor = 5;
}

message ListOrdersResponse {
  repeated Order items = 1;
  google.protobuf.Timestamp server_time = 2;
  string next_cursor = 3;
}

message CancelOrderRequest {
  string token = 1;
  string order_id = 2;
}

message CancelOrderResponse {
  Order order = 1;
}

message CreateTwapRequest {
  string token = 1;
  int64 trading_account_id = 2;
  int64 instrument_id = 3;
  string side = 4;
  string total_quantity = 5;
  google.protobuf.Timestamp start_at = 6;
  google.protobuf.Timestamp end_at = 7;
  int32 interval_seconds = 8;
  string limit_price = 9;
  string max_quantity = 10;
  string execution_type = 11;
  int32 order_timeout_seconds = 12;
  string idempotency_key = 13;
}

message CreateTwapResponse {
  TwapJob job = 1;
}

message GetTwapRequest {
  string token = 1;
  string twap_id = 2;
}

message GetTwapResponse {
  TwapJob job = 1;
}

message ListTwapsRequest {
  string token = 1;
  int64 trading_account_id = 2;
  string view = 3;
  string status = 4;
  int32 limit = 5;
  string cursor = 6;
}

message ListTwapsResponse {
  repeated TwapJob items = 1;
  google.protobuf.Timestamp server_time = 2;
  string next_cursor = 3;
}

message ListTwapOrdersRequest {
  string token = 1;
  string twap_id = 2;
}

message ListTwapOrdersResponse {
  repeated Order items = 1;
  google.protobuf.Timestamp server_time = 2;
}

message CancelTwapRequest {
  string token = 1;
  string twap_id = 2;
}

message CancelTwapResponse {
  TwapJob job = 1;
}

message ArbitrageLeg {
  int64 trading_account_id = 1;
  int64 instrument_id = 2;
  string product_name = 3;
  string account_name = 4;
  string exchange = 5;
  string contract_type = 6;
  string exchange_symbol = 7;
  string base_asset = 8;
  string quote_asset = 9;
}

message ArbitrageCombination {
  reserved 8, 9;
  reserved "order_notional", "max_delta_notional";
  string id = 1;
  string idempotency_key = 2;
  ArbitrageLeg leg_a = 3;
  ArbitrageLeg leg_b = 4;
  string ask_threshold_bps = 5;
  string bid_threshold_bps = 6;
  string target_notional = 7;
  string execution_mode = 10;
  string maker_leg = 11;
  string status = 12;
  string position_notional = 13;
  string current_ask_spread_bps = 14;
  string current_bid_spread_bps = 15;
  bool market_data_stale = 16;
  string error_message = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  google.protobuf.Timestamp closed_at = 20;
  string cumulative_turnover_notional = 21;
  int32 consecutive_failures = 22;
  google.protobuf.Timestamp next_retry_at = 23;
  bool position_uncertain = 24;
  string runtime_state = 25;
  string leg_a_base_position = 26;
  string leg_b_base_position = 27;
  string carry_base_quantity = 28;
  string leg_a_venue_base_position = 29;
  string leg_b_venue_base_position = 30;
  string leg_a_position_difference = 31;
  string leg_b_position_difference = 32;
  google.protobuf.Timestamp last_position_reconciled_at = 33;
  string gross_turnover_notional = 34;
  string leg_a_average_entry_price = 35;
  string leg_b_average_entry_price = 36;
  string average_entry_spread_bps = 37;
  string leg_a_unrealized_pnl = 38;
  string leg_b_unrealized_pnl = 39;
  string realized_spread_pnl = 40;
  string estimated_funding_pnl = 41;
  string combined_position_annualized = 42;
  bool funding_history_complete = 43;
  string leg_a_venue_baseline_base_position = 44;
  string leg_b_venue_baseline_base_position = 45;
  google.protobuf.Timestamp venue_baseline_captured_at = 46;
  string leg_a_expected_base_position = 47;
  string leg_b_expected_base_position = 48;
  string leg_a_venue_notional = 49;
  string leg_b_venue_notional = 50;
  string leg_a_venue_valuation_price = 51;
  string leg_b_venue_valuation_price = 52;
  google.protobuf.Timestamp leg_a_venue_valuation_at = 53;
  google.protobuf.Timestamp leg_b_venue_valuation_at = 54;
  string run_mode = 55;
  string entry_direction = 56;
  string leg_a_leverage = 57;
  string leg_b_leverage = 58;
  string exit_policy = 59;
  string exit_annualized_rate = 60;
  int32 exit_after_seconds = 61;
  google.protobuf.Timestamp target_reached_at = 62;
  google.protobuf.Timestamp scheduled_exit_at = 63;
  string one_shot_phase = 64;
  string early_exit_funding_8h_annualized_floor = 65;
  string leg_a_liquidation_distance_pct = 66;
  string leg_b_liquidation_distance_pct = 67;
  string early_exit_liquidation_distance_pct = 68;
  ArbitrageFinalMetrics final_metrics = 69;
}

message ArbitrageFinalMetrics {
  string status = 1;
  google.protobuf.Timestamp completed_at = 2;
  int32 retry_count = 3;
  string last_error = 4;
  string realized_spread_pnl = 5;
  string estimated_funding_pnl = 6;
  string estimated_trading_fee = 7;
  string combined_position_annualized = 8;
  string metrics_quality = 9;
  string holding_seconds = 10;
  string notional_exposure_seconds = 11;
  google.protobuf.Timestamp calculated_at = 12;
}

message ArbitrageCreateFailure {
  string code = 1;
  string message = 2;
  string leg = 3;
  map<string, string> details = 4;
}

message CreateArbitrageCombinationRequest {
  reserved 9, 10;
  reserved "order_notional", "max_delta_notional";
  string token = 1;
  int64 leg_a_trading_account_id = 2;
  int64 leg_a_instrument_id = 3;
  int64 leg_b_trading_account_id = 4;
  int64 leg_b_instrument_id = 5;
  string ask_threshold_bps = 6;
  string bid_threshold_bps = 7;
  string target_notional = 8;
  string execution_mode = 11;
  string maker_leg = 12;
  string idempotency_key = 13;
  string run_mode = 14;
  string entry_direction = 15;
  string leg_a_leverage = 16;
  string leg_b_leverage = 17;
  string exit_policy = 18;
  string exit_annualized_rate = 19;
  int32 exit_after_seconds = 20;
  string early_exit_funding_8h_annualized_floor = 21;
  string early_exit_liquidation_distance_pct = 22;
}

message CreateArbitrageCombinationResponse {
  ArbitrageCombination combination = 1;
}

message UpdateArbitrageCombinationRequest {
  reserved 6;
  reserved "order_notional";
  string token = 1;
  string combination_id = 2;
  optional string ask_threshold_bps = 3;
  optional string bid_threshold_bps = 4;
  optional string target_notional = 5;
  optional int32 exit_after_seconds = 7;
  optional string exit_annualized_rate = 8;
  optional string early_exit_funding_8h_annualized_floor = 9;
  optional string early_exit_liquidation_distance_pct = 10;
}

message UpdateArbitrageCombinationResponse {
  ArbitrageCombination combination = 1;
}

message GetArbitrageCombinationRequest {
  string token = 1;
  string combination_id = 2;
}

message GetArbitrageCombinationResponse {
  ArbitrageCombination combination = 1;
  repeated Order orders = 2;
  repeated ArbitrageExecution recent_executions = 3;
  repeated ArbitrageEvent recent_events = 4;
}

message ArbitrageExecution {
  string id = 1;
  string direction = 2;
  string status = 3;
  string trigger_spread_bps = 4;
  string target_base_quantity = 5;
  string filled_base_quantity = 6;
  string delta_notional = 7;
  string error_message = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string requested_notional = 11;
  string position_effect = 12;
  bool reduce_only = 13;
}

message ArbitrageEvent {
  string id = 1;
  string type = 2;
  string message = 3;
  google.protobuf.Timestamp created_at = 4;
  string execution_id = 5;
  google.protobuf.Struct payload = 6;
}

message PreflightArbitrageCombinationRequest {
  string token = 1;
  int64 leg_a_trading_account_id = 2;
  int64 leg_a_instrument_id = 3;
  int64 leg_b_trading_account_id = 4;
  int64 leg_b_instrument_id = 5;
  string ask_threshold_bps = 6;
  string bid_threshold_bps = 7;
  string target_notional = 8;
  string execution_mode = 9;
  string maker_leg = 10;
  string run_mode = 11;
  string entry_direction = 12;
  string leg_a_leverage = 13;
  string leg_b_leverage = 14;
  string exit_policy = 15;
  string exit_annualized_rate = 16;
  int32 exit_after_seconds = 17;
  string early_exit_funding_8h_annualized_floor = 18;
  string early_exit_liquidation_distance_pct = 19;
}

message PreflightDecimal {
  string value = 1;
  string status = 2;
  string unit = 3;
}

message PreflightLeg {
  PreflightDecimal available_funds = 1;
  PreflightDecimal required_margin = 2;
  PreflightDecimal estimated_fee = 3;
  PreflightDecimal min_quantity = 4;
  PreflightDecimal min_notional = 5;
  PreflightDecimal quantity_step = 6;
  PreflightDecimal rounded_base_quantity = 7;
}

message PreflightWarning {
  string code = 1;
  string message = 2;
  string leg = 3;
  string exchange = 4;
  map<string, string> details = 5;
}

message PreflightIncreaseTargetRequest {
  string token = 1;
  string combination_id = 2;
  string new_target_notional = 3;
}

message PreflightIncreaseLeg {
  string additional_notional = 1;
  string incremental_quantity = 2;
  PreflightDecimal incremental_margin = 3;
  PreflightDecimal estimated_fee = 4;
  PreflightDecimal available_funds = 5;
  PreflightDecimal min_quantity = 6;
  PreflightDecimal min_notional = 7;
  PreflightDecimal quantity_step = 8;
  string incremental_quantity_unit = 9;
}

message PreflightIncreaseTargetResponse {
  bool executable = 1;
  string current_target_notional = 2;
  string new_target_notional = 3;
  string requested_target_delta = 4;
  PreflightIncreaseLeg leg_a = 5;
  PreflightIncreaseLeg leg_b = 6;
  repeated PreflightWarning warnings = 7;
  google.protobuf.Timestamp checked_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  string code = 10;
  string message = 11;
  string leg = 12;
  string exchange = 13;
  string target_notional_unit = 14;
}

message PreflightArbitrageCombinationResponse {
  bool executable = 1;
  google.protobuf.Timestamp checked_at = 2;
  google.protobuf.Timestamp expires_at = 3;
  PreflightLeg leg_a = 4;
  PreflightLeg leg_b = 5;
  repeated PreflightWarning warnings = 6;
  string code = 7;
  string message = 8;
  string leg = 9;
  string exchange = 10;
}

message ListArbitrageCombinationHistoryRequest {
  string token = 1;
  string combination_id = 2;
  int32 limit = 3;
  string cursor = 4;
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  string execution_id = 7;
}

message ListArbitrageCombinationOrdersRequest {
  ListArbitrageCombinationHistoryRequest query = 1;
}

message ListArbitrageCombinationExecutionsRequest {
  ListArbitrageCombinationHistoryRequest query = 1;
}

message ListArbitrageCombinationEventsRequest {
  ListArbitrageCombinationHistoryRequest query = 1;
}

message ListArbitrageCombinationOrdersResponse {
  repeated Order items = 1;
  string next_cursor = 2;
}

message ListArbitrageCombinationExecutionsResponse {
  repeated ArbitrageExecution items = 1;
  string next_cursor = 2;
}

message ListArbitrageCombinationEventsResponse {
  repeated ArbitrageEvent items = 1;
  string next_cursor = 2;
}

message ListArbitrageCombinationsRequest {
  string token = 1;
  string view = 2;
  int32 limit = 3;
  string cursor = 4;
}

message ListArbitrageCombinationsResponse {
  repeated ArbitrageCombination items = 1;
  google.protobuf.Timestamp server_time = 2;
  string next_cursor = 3;
  int64 total = 4;
}

message CloseArbitrageCombinationRequest {
  string token = 1;
  string combination_id = 2;
}

message CloseArbitrageCombinationResponse {
  ArbitrageCombination combination = 1;
}

message GetArbitrageCountsByOwnerInternalRequest {
  string service_token = 1;
}

message OwnerArbitrageCounts {
  string owner_username = 1;
  int64 running = 2;
  int64 closing = 3;
  int64 closed = 4;
  int64 failed = 5;
}

message GetArbitrageCountsByOwnerInternalResponse {
  repeated OwnerArbitrageCounts items = 1;
}
